name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Le SDK Android est deja installe sur les machines GitHub :
      # on accepte les licences et on ajoute la plateforme 36 sans action externe.
      - name: Preparer le SDK Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME"

      - name: Installer les dependances
        run: npm install

      - name: Construire l'interface (www/index.html)
        run: python3 build.py

      - name: Generer le projet Android
        run: npm run android:prepare

      # Cle de signature PERMANENTE : chaque APK est signe avec la meme cle,
      # donc les mises a jour s'installent par-dessus sans desinstaller.
      # Si tu ajoutes le secret KEYSTORE_BASE64, il remplace la cle ci-dessous.
      - name: Installer la cle de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
