      - name: Compiler l'APK signe
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD || 'taximetre2026' }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS || 'taximetre' }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD || 'taximetre2026' }}"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/Taximetre.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Taximetre-apk
          path: dist/Taximetre.apk

      - name: Publier une release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Taximetre.apk
